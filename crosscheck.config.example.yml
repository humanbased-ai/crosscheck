# crosscheck.config.yml
# This file is designed to be easily read and modified by coding agents.
# All fields are optional — crosscheck uses sensible defaults.

# ─── Deployment ──────────────────────────────────────────────────────────────
# Set automatically on first run of `crosscheck watch`.
# personal — monitor your own repos and orgs; review only PRs you author
# team     — monitor org repos only; review all PRs from any author
# Absent = first-run prompt will ask you to choose.
# deployment: personal

# ─── Mode ────────────────────────────────────────────────────────────────────
# single-vendor: one AI reviews all PRs
# cross-vendor:  each AI reviews the other's PRs (Claude ↔ Codex)
mode: cross-vendor

# ─── Clone protocol ──────────────────────────────────────────────────────────
# How crosscheck clones PR repos for review.
# ssh   — git@github.com:owner/repo.git (uses your local SSH keys)
# https — https://github.com/owner/repo.git (uses GitHub token)
# Pick https if you have a multi-account SSH setup or your default SSH key
# cannot access target repos. Independent of `gh config get git_protocol`.
clone_protocol: ssh

# ─── Vendors ─────────────────────────────────────────────────────────────────
vendors:
  codex:
    enabled: true
    model: gpt-5.6-terra    # gpt-5.6-luna | gpt-5.6-terra | gpt-5.6-sol; unset = tier model (api-key) / CLI default (subscription)
    auth: subscription      # subscription (device-auth OAuth) | api-key
    effort: medium          # low | medium | high | xhigh | max | ultra (ultra: terra/sol only)
    # timeout_sec: 1200     # max seconds per CLI call; unset = tier-based (300/600/1200)

  claude:
    enabled: true
    model: sonnet           # haiku | sonnet | opus
    effort: medium          # low | medium | high | max
    # timeout_sec: 1200     # max seconds per CLI call; unset = tier-based (300/600/1200)

# ─── Quality & Focus ─────────────────────────────────────────────────────────
quality:
  mode: smart               # smart (default) | fixed
  #
  # smart  - dynamically adjust model + effort based on task type. The PR is
  #          classified from its changed-file list against the versioned policy
  #          in src/config/review-strategy.json: a lockfile-only PR is skipped
  #          entirely, a docs PR gets review with no fix loop, a PR touching
  #          auth or a migration is promoted to `thorough`.
  #
  #          Every comment cites the strategy version, class, and tier it ran
  #          under, so a past review stays explicable after the policy changes.
  #          Full rationale: docs/dynamic-thoroughness.md
  #
  # fixed  - every agent call uses `tier` below, regardless of what changed.
  #
  # NOTE: leave vendors.*.model unset under smart. An explicit model outranks
  # the strategy, so pinning one makes per-PR selection a no-op — and crosscheck
  # then withholds the tier from the comment rather than citing one that did not
  # run. `crosscheck onboard` clears the pin (and says so) when you pick smart.
  #
  # vendors.*.effort behaves the opposite way: under smart the class's effort
  # wins over the value below. `effort` always has a value (it has a schema
  # default), so crosscheck cannot tell a deliberate setting from an unset one,
  # and honoring it would disable effort escalation for every install. Use
  # `mode: fixed` if you want a hand-set effort applied to every call.

  tier: balanced            # fast | balanced | thorough
  #
  # Under `fixed` this is the tier for every call. Under `smart` it is the
  # fallback used when a PR's file list cannot be read.
  #
  # Cost is output-token cost at 48k output tokens, the measured median for one
  # review. A review is an agentic session, so it takes 10-16 minutes of wall
  # clock (median 643s over 43 logged runs) - the tier changes depth and the
  # subprocess timeout, not seconds-scale latency.
  #
  #   tier       claude          codex           claude $   codex $
  #   ---------  --------------  --------------  ---------  --------
  #   fast       Haiku 4.5       GPT-5.6 Luna        0.24      0.06
  #   balanced   Sonnet 5        GPT-5.6 Terra       0.72      0.58
  #   thorough   Opus 5          GPT-5.6 Sol         1.20      1.44
  #
  # claude-fable-5 is banned from review: 2x Opus 5's price for a lower coding
  # benchmark score. See src/config/review-strategy.json.

  focus:                    # optional — narrows review scope
    - security
    - types
    - performance
    # - naming
    # - test-coverage
    # - documentation

  custom_prompt: |          # optional — appended to every review
    Focus on correctness and security. Be concise.

# ─── Agent skills ────────────────────────────────────────────────────────────
# Enabled skills are available to coding agents. Each skill's own description
# and the agent decide when it is activated for a workflow step.
skills:
  enabled:
    - code-review-skill     # recommended · @awesome-skills (MIT)
    - diagnosing-bugs       # recommended · @mattpocock (MIT)
    # - code-review         # preloaded, opt-in · @mattpocock (MIT)
    # - codebase-design     # preloaded, opt-in · @mattpocock (MIT)

  # Codex only. Codex reaches the skill broker (an MCP server) only when its
  # sandbox is disabled: under -s read-only, -s workspace-write, -a never and
  # --full-auto alike it cancels every tool call, so skills silently do nothing.
  # Turning this on lets codex run unsandboxed against the PR checkout — which is
  # untrusted code — in exchange for skills actually working. Crosscheck removes
  # the git credential from the checkout and passes codex an allowlisted
  # environment (no GITHUB_TOKEN) either way, but a prompt injection can still
  # read the working tree and reach the network. Claude needs none of this: its
  # broker works sandboxed.
  codex_full_access: false

# ─── Budget ──────────────────────────────────────────────────────────────────
budget:
  codex_monthly_usd: 20     # null = unlimited (use if on subscription)
  per_review_usd: 2.00      # hard stop per single review

# ── Orgs (watch mode) ─────────────────────────────────────────────────────────
# Monitor entire orgs — all repos get covered with one webhook per org.
# Takes priority over `repos` when both are set.
orgs:
  - humanbased-ai
  - codatta

# ─── Users ───────────────────────────────────────────────────────────────────
# Monitor all repos owned by personal GitHub accounts (non-org).
# At startup, crosscheck enumerates each user's repos and registers webhooks.
# Useful when your AI agents open PRs across many personal repos.
# Combines with `orgs` and `repos` — all configured sources are additive.
# users:
#   - beingzy          # your personal account
#   - my-agent-login   # a bot account that pushes to its own repos

# ─── Repos ───────────────────────────────────────────────────────────────────
# Omit entirely to auto-detect from `git remote` (useful in watch mode)
# repos: still works for monitoring specific repos only
# repos:
#   - owner: acme
#     name: specific-repo
#
# To narrow the workflow for one repo (e.g. make it review-only), do NOT edit this
# file — run `crosscheck alter <owner>/<repo> --review-only`. That writes a standalone
# override at ~/.crosscheck/workflows/<owner>__<repo>.yml, live-reloaded per PR.
repos:
  - owner: codatta
    name: my-repo

# ─── Routing ─────────────────────────────────────────────────────────────────
routing:
  # Restrict reviews to PRs opened by these GitHub logins.
  # Auto-filled with your login by `crosscheck init` or first `crosscheck watch`.
  # Empty list = no author restriction (applies body-pattern check only).
  # allowed_authors:
  #   - beingzy          # your personal account (Claude Code runs as you)
  #   - my-org-bot       # a dedicated bot account

  # Author-based routing fallback — maps GitHub login → vendor origin.
  # Used when no body / commit / branch pattern matches. Lets you skip the attribution
  # footer requirement when an author consistently uses a single agent.
  #   beingzy: claude    → PRs from beingzy treated as Claude-authored → Codex reviews them
  #   my-bot: codex      → PRs from my-bot treated as Codex-authored → Claude reviews them
  # NOTE: in `mode: cross-vendor` with BOTH vendors enabled, this map is bypassed —
  # if the same author commits via both agents, a static route is structurally wrong.
  # In that case, rely on attribution detection (body / commits / branch) and
  # `fallback_reviewer` below for PRs with no attribution markers.
  # author_routes:
  #   beingzy: claude

  # Fallback reviewer when origin cannot be determined (no pattern/branch/route matched).
  # 'auto'  = pick whichever vendor is currently authenticated (codex first, then claude).
  # 'codex' / 'claude' = always use that vendor.
  # null    = skip the PR (legacy cross-vendor behaviour).
  fallback_reviewer: auto

  # Branch-prefix routing — checked when body and commit patterns don't match.
  # Agents should branch with these prefixes (claude/* and codex/*) so origin is
  # always detectable even without attribution text in the PR body.
  claude_branch_prefixes:
    - "claude/"
  codex_branch_prefixes:
    - "codex/"

  # Body and commit pattern matching — checked first, before branch prefix.
  # Patterns are matched against both the PR body and commit messages (Co-Authored-By trailers).
  codex_reviews_patterns:
    - "Generated with \\[Claude Code\\]"    # PR body attribution footer
    - "Co-Authored-By: Claude"              # commit trailer added by Claude Code
  claude_reviews_patterns:
    - "Generated with \\[OpenAI Codex\\]"   # PR body attribution footer
    - "Co-Authored-By: codex"               # commit trailer added by Codex

# ─── Tunnel (watch mode only) ────────────────────────────────────────────────
# Controls how crosscheck watch receives GitHub webhook events on your laptop.
#
# localhost.run (default) — zero config, SSH tunnel, random URL each restart.
#   No install required. URL changes on reconnect → webhook re-registered automatically.
#   Limitation: events delivered while the tunnel is down are lost.
#
# smee — webhook relay via smee.io. Stable channel URL; events are queued and
#   replayed even when your laptop is offline or watch is restarted.
#   Setup:
#     1. npm install -g smee-client
#     2. Visit https://smee.io/new — copy the channel URL
#     3. Point your GitHub org/repo webhook Payload URL to the channel URL
#     4. Set tunnel.smee_channel below
#
# tunnel:
#   backend: smee
#   smee_channel: https://smee.io/your-channel-id

# ─── Server ──────────────────────────────────────────────────────────────────
# crosscheck watch binds a local HTTP server on `port` (auto-increments on
# collision) and listens for webhook delivery at `webhook_path`. pid_file is
# unused (legacy daemon management).
server:
  port: 7891
  webhook_path: /webhook
  # pid_file: ~/.crosscheck/crosscheck.pid  # legacy — unused

# ─── Post-Review Auto-Fix ────────────────────────────────────────────────────
# Controls HOW fixes are delivered after the agent applies them.
# Step sequencing (whether to run fix/recheck, trigger conditions, vendor assignment)
# is configured in ~/.crosscheck/workflow.yml.
#
post_review:
  auto_fix:
    delivery:
      mode: pull_request        # pull_request | commit | comment
      # pull_request → fix PR targets the original branch; human approves before merge
      # commit       → fixes pushed directly onto the original PR branch
      # comment      → suggested fixes posted as review comments only
      pr_title: "fix: address CR issues in #{original_pr_title}"
      label: cr-autofix         # GitHub label applied to the fix PR

# ─── Watch ───────────────────────────────────────────────────────────────────
# watch:
#   idle_issue:
#     enabled: false      # opt-in: set to true to prompt when watch is idle for timeout_min minutes
#     timeout_min: 30     # minutes of no PR activity before the idle prompt fires (min: 5)

# ─── Backtrace ───────────────────────────────────────────────────────────────
# On startup, scan all open PRs in the monitored scope and review any that have
# never received a [crosscheck] comment. Ensures coverage for PRs opened while
# crosscheck was offline or before it was first set up.
# Off by default — enable with the config below or pass --backtrace at startup.
# backtrace:
#   enabled: true   # set to true to enable the startup scan (or pass --backtrace)

# ─── Issue enrichment ────────────────────────────────────────────────────────
# Recover the linked tracker issue (e.g. IN-2017) from the PR title / branch /
# body and inject its goal — title, description, labels, estimate, project —
# into the reviewer prompt, so the review judges the change against the stated
# goal instead of inferring intent from the diff alone.
# Off by default. Requires LINEAR_API_KEY in the environment (read-only scope is
# enough). Fail-soft: an unresolved or unreachable issue degrades the review to
# diff-only, never blocks it.
# issue_enrichment:
#   enabled: true
#   provider: linear          # linear (only provider today)
#   team_keys: [IN]           # restrict extraction to these keys; [] = match any
#   max_description_chars: 4000  # cap injected description length (0 = no cap)

# ─── Logs ────────────────────────────────────────────────────────────────────
# Structured debug logs written to ~/.crosscheck/logs/YYYY-MM-DD.ndjson
# Each line is a JSON object: { ts, level, event, ...context }
logs:
  enabled: true
  retention_days: 30  # delete files older than N days (min: 1, max: 365)

# ─── Display ─────────────────────────────────────────────────────────────────
# Terminal output theme for crosscheck watch.
# Override individual colors using chalk color names (red, green, blue, cyan,
# yellow, magenta, white, gray, dim, bold) or hex values (#rrggbb).
# display:
#   theme:
#     bar_fill: blue         # filled █ segments on the PR size bar
#     bar_empty: dim         # empty  ░ segments (all bars)
#     cr_approve: green      # CR bar + verdict label when APPROVE
#     cr_needs_work: yellow  # CR bar + verdict label when NEEDS WORK
#     cr_block: red          # CR bar + verdict label when BLOCK
#     fix_fill: cyan         # filled segments on the FIX bar


# ─── Linear ──────────────────────────────────────────────────────────────────
# Mirror review verdicts onto the Linear issue a PR belongs to.
# Disabled by default. See docs/linear-identity.md for the full setup guide.
#
# Two identity tiers:
#   api_key            (T0) — your own Linear key. Writes carry a signature line
#                             but Linear still attributes them to your account.
#   client_credentials (T1) — an OAuth app in your workspace. crosscheck mints a
#                             token per run and writes render as the app itself
#                             (botActor), not as a human. Recommended.
#
# A failed T1 token mint ABORTS the run — crosscheck never silently falls back to
# an API key, because that would re-attribute agent writes to a person.
# linear:
#   enabled: true
#   auth:
#     mode: client_credentials          # api_key | client_credentials
#     # Env var NAMES — never put secrets in this file.
#     api_key_env: LINEAR_API_KEY       # used when mode: api_key
#     client_id_env: LINEAR_CLIENT_ID
#     client_secret_env: LINEAR_CLIENT_SECRET
#     # NOTE: "read,write" does NOT cover initiatives — initiative:read and
#     # initiative:write are separate scopes you must request explicitly.
#     scopes: "read,write"
#   identity:
#     actor: crosscheck                 # createAsUser name in T1
#     # First line of every Linear write. Placeholders: {actor} {product} {model}
#     # {reviewer} {icon}. Ones with no value resolve to empty and the leftover
#     # separators are tidied, so this reads correctly either way.
#     signature: "🤖 {actor} · {model}"
#     # Optional logo, rendered inline where {icon} appears in the signature.
#     # The better route is the OAuth app avatar (T1) — Linear renders it natively
#     # beside the comment. Inline images may render block-level; test first.
#     icon_url: ""
#     # Suffix the actor with the step that produced the write, so a review, a fix
#     # and a recheck are distinguishable: crosscheck/review, crosscheck/fix, ...
#     # Set false for one flat actor name.
#     per_step_actor: true
#   # Which verdicts get mirrored. Defaults to the ones needing action — add
#   # APPROVE if you also want a comment on every clean review.
#   comment_on:
#     - NEEDS_WORK
#     - BLOCK
#   # Team key prefixes that may be matched as bare refs (IN-2269) in a branch,
#   # title, or body. Leave empty to only follow explicit linear.app issue URLs —
#   # without this, tokens like UTF-8 and SHA-256 have the same shape as a ref.
#   team_keys:
#     - IN


# ─── Branding ────────────────────────────────────────────────────────────────
# Customize how crosscheck identifies itself in review comments.
# Useful for teams, shared services, or personal branding.
# brand:
#   service_name: crosscheck              # shown in comment headers (default: crosscheck)
#   comment_header: ""                    # text prepended to every review comment
#   comment_footer: ""                    # text appended to every review comment
#   reviewer_attribution: ""             # replaces "Reviewed by {vendor}" attribution line
