  <text x="371" y="22" fill="#8b919b" font-size="12" text-anchor="middle">crosscheck onboard</text>
<text x="18.0" y="52" fill="#c8ccd4" font-weight="600" xml:space="preserve">Step 9.5 — Linear write-back (optional)</text>
<text x="34.8" y="72" fill="#c8ccd4" opacity="0.55" xml:space="preserve">Post the review verdict onto the Linear issue a PR belongs to.</text>

<text x="34.8" y="112" fill="#c8ccd4" xml:space="preserve">[1] off           — leave Linear alone</text>
<text x="34.8" y="132" fill="#c8ccd4" xml:space="preserve">[2] api key       — works immediately. Comments post under </text><text x="530.4" y="132" fill="#c8ccd4" opacity="0.55" xml:space="preserve">your own Linear account</text>
<text x="34.8" y="152" fill="#c8ccd4" xml:space="preserve">[3] workspace app — comments post as </text><text x="345.6" y="152" fill="#56b6c2" xml:space="preserve">crosscheck</text><text x="438.0" y="152" fill="#c8ccd4" xml:space="preserve">itself, with its own icon</text>
<text x="202.8" y="172" fill="#c8ccd4" opacity="0.55" xml:space="preserve">one app per workspace, ~5 min, needs Linear settings access</text>

<text x="34.8" y="212" fill="#c8ccd4" opacity="0.55" xml:space="preserve">Current: off</text>

<text x="34.8" y="252" fill="#c8ccd4" xml:space="preserve">Choice [1]: 3</text>
<text x="34.8" y="272" fill="#c8ccd4" opacity="0.55" xml:space="preserve">Your Linear team key prefixes, so refs like ENG-42 in a branch name resolve.</text>
<text x="34.8" y="292" fill="#c8ccd4" opacity="0.55" xml:space="preserve">Comma-separated. Leave blank to only follow full linear.app links.</text>
<text x="34.8" y="312" fill="#c8ccd4" xml:space="preserve">team keys: IN</text>

<text x="34.8" y="352" fill="#c8ccd4" opacity="0.55" xml:space="preserve">Create the app, then set LINEAR_CLIENT_ID and LINEAR_CLIENT_SECRET.</text>
<text x="34.8" y="372" fill="#c8ccd4" opacity="0.55" xml:space="preserve">Walkthrough: docs/linear-identity.md</text>

<text x="18.0" y="412" fill="#c8ccd4" font-weight="600" xml:space="preserve">Step 10 — review and write config</text>

<text x="34.8" y="452" fill="#c8ccd4" xml:space="preserve">linear       </text><text x="144.0" y="452" fill="#56b6c2" xml:space="preserve">client_credentials</text><text x="303.6" y="452" fill="#c8ccd4" opacity="0.55" xml:space="preserve">(IN)</text>
</svg>