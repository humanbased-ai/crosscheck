name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force a specific version bump (overrides conventional-commit detection)'
        required: false
        default: ''
        type: choice
        options: ['', patch, minor, major]
      exact_version:
        description: 'Publish an exact version (e.g. 0.9.0). Overrides conventional-commit detection.'
        required: false
        default: ''
        type: string

# Skip the release cycle when the push is itself the version-bump commit.
jobs:
  # ── Job 1: determine whether a release is needed and which version ───────────
  compute:
    name: Compute version
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.ver.outputs.new_version }}
      new_tag:     ${{ steps.ver.outputs.new_tag }}
      changelog:   ${{ steps.ver.outputs.changelog }}
      should_release: ${{ steps.ver.outputs.new_tag != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version from conventional commits
        id: semver
        if: inputs.exact_version == ''
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          default_bump: ${{ inputs.bump || 'patch' }}
          # v6 has no *_string_token inputs — passing them only produced an
          # "Unexpected input(s)" annotation and was silently ignored. Its
          # defaults already give BREAKING CHANGE → major, feat → minor and
          # fix/perf → patch, so only the refactor rule needs declaring.
          custom_release_rules: 'refactor:patch'

      - name: Resolve version
        id: ver
        env:
          SEMVER_CHANGELOG: ${{ steps.semver.outputs.changelog }}
        run: |
          if [ -n "${{ inputs.exact_version }}" ]; then
            echo "new_version=${{ inputs.exact_version }}" >> $GITHUB_OUTPUT
            echo "new_tag=v${{ inputs.exact_version }}"    >> $GITHUB_OUTPUT
            echo "changelog="                              >> $GITHUB_OUTPUT
          else
            echo "new_version=${{ steps.semver.outputs.new_version }}" >> $GITHUB_OUTPUT
            echo "new_tag=${{ steps.semver.outputs.new_tag }}"         >> $GITHUB_OUTPUT
            # changelog is multiline — use the heredoc form required by GitHub Actions
            EOF_DELIM=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            {
              echo "changelog<<$EOF_DELIM"
              echo "$SEMVER_CHANGELOG"
              echo "$EOF_DELIM"
            } >> $GITHUB_OUTPUT
          fi

      - name: No release needed
        if: steps.ver.outputs.new_tag == ''
        run: echo "No version-worthy commits since last tag — skipping publish."

  # ── Job 2: publish — gated by the `production` environment ───────────────────
  # Everything with an outward effect (git tag, npm publish, GitHub Release)
  # lives in this job, so the gate holds all of it until a reviewer approves.
  # GitHub cancels an unapproved deployment after 30 days and reports the run as
  # failed; approve or reject promptly rather than letting one age out.
  publish:
    name: Publish to npm
    needs: compute
    if: needs.compute.outputs.new_tag != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write        # push git tag and version-bump commit
      id-token: write        # npm provenance
      actions: write         # dispatch publish.yml for staging @beta
      pull-requests: write   # open staging sync PR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Tag release
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ needs.compute.outputs.new_version }}" ]; then
            npm version "${{ needs.compute.outputs.new_version }}" --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "chore: release ${{ needs.compute.outputs.new_tag }}"
          fi
          if git rev-parse "${{ needs.compute.outputs.new_tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ needs.compute.outputs.new_tag }} already exists — skipping."
          else
            git tag "${{ needs.compute.outputs.new_tag }}"
            git push origin "${{ needs.compute.outputs.new_tag }}"
          fi

      - name: Publish to npm @latest
        id: publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@humanbased/crosscheck@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
            echo "Version ${VERSION} already on npm — skipping publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish --access public
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute.outputs.new_tag }}
          name:     ${{ needs.compute.outputs.new_tag }}
          body:     ${{ needs.compute.outputs.changelog }}
          generate_release_notes: true

      - name: Notify release published
        # The package is already on npm by this point — an SMTP outage must not
        # turn a successful release into a red run.
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[crosscheck] ${{ needs.compute.outputs.new_tag }} ${{ steps.publish.outputs.published == 'true' && 'published to npm' || 'released — version was already on npm' }}"
          to: yi@inductive.network, ${{ secrets.MAIL_USERNAME }}
          from: crosscheck-ci <${{ secrets.MAIL_USERNAME }}>
          body: |
            crosscheck ${{ needs.compute.outputs.new_tag }} ${{ steps.publish.outputs.published == 'true' && 'has been published to npm as @latest.' || 'was already on npm — the registry was left untouched and the rest of the release completed.' }}

            Version: ${{ steps.publish.outputs.version }}
            Install: npm install -g @humanbased/crosscheck@${{ steps.publish.outputs.version }}

            GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.compute.outputs.new_tag }}
            Workflow run:   https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Changes:
            ${{ needs.compute.outputs.changelog }}

      - name: Sync release version to staging
        # Staging is a protected branch — a direct push is never permitted, so
        # the bump goes through a PR. The step is non-fatal: the package is
        # already on npm by now, and a failed sync must not turn a completed
        # release red. It is not silent either — a failure that only shows as a
        # green run is how staging drifted to 1.0.0 while npm was on 1.2.0.
        continue-on-error: true
        env:
          # GITHUB_TOKEN cannot open PRs: the org disallows GitHub Actions
          # creating or approving them, so `gh pr create` fails with
          # "GitHub Actions is not permitted to create or approve pull requests".
          # RELEASE_TOKEN (a PAT) is not subject to that policy.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          NEW_TAG: ${{ needs.compute.outputs.new_tag }}
        run: |
          git fetch origin staging
          git fetch --tags
          git checkout staging
          git checkout "$NEW_TAG" -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "staging already at $NEW_TAG — nothing to sync"
            exit 0
          fi
          SYNC_BRANCH="ci/sync-$NEW_TAG-to-staging"
          git checkout -b "$SYNC_BRANCH"
          git commit -m "chore: sync $NEW_TAG version to staging"
          # The branch is CI-owned and disposable; force past any leftover from
          # an earlier attempt at the same tag.
          git push --force origin "$SYNC_BRANCH"

          # Leave no branch behind when the PR cannot be opened for a reason
          # other than one already being open for this tag — unreviewable
          # ci/sync-* branches accumulated for ten releases that way. But a
          # rerun must not close the only open sync PR for this tag.
          if ! PR_CREATE_OUTPUT="$(gh pr create \
              --base staging \
              --head "$SYNC_BRANCH" \
              --title "chore: sync $NEW_TAG version to staging" \
              --body "Automated version sync from release $NEW_TAG." 2>&1)"; then
            echo "$PR_CREATE_OUTPUT"
            if ! echo "$PR_CREATE_OUTPUT" | grep -qi "already exists"; then
              git push origin --delete "$SYNC_BRANCH" || true
              echo "::error::Could not open the $NEW_TAG version-sync PR — staging still carries the previous version. Set the RELEASE_TOKEN secret (a PAT with contents+pull-requests write), or bump staging's package.json to $NEW_TAG by hand."
              exit 1
            fi
            echo "$NEW_TAG sync PR already exists for $SYNC_BRANCH — reusing it."
          fi

          gh pr merge "$SYNC_BRANCH" --merge \
            || gh pr merge "$SYNC_BRANCH" --merge --auto \
            || echo "::warning::$NEW_TAG sync PR is open but not merged — merge it to bring staging up to date."

      - name: Trigger @beta publish on staging
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish.yml',
              ref: 'staging',
            })
