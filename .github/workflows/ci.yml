name: CI

on:
  push:
    branches: ['**']
  # Internal PRs also run on push. A fork's pushes don't reach this repo, so this
  # trigger is the only CI a fork PR gets.
  pull_request:
    branches: [main, staging]

jobs:
  check:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify binary is executable
        run: test -x dist/cli.js

      - name: Test
        run: npm test
