name: Promote staging → main

on:
  schedule:
    - cron: '0 18 * * 5'   # Every Friday at 18:00 UTC
  workflow_dispatch:

jobs:
  promote:
    name: Merge staging into main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if staging is ahead of main
        id: check
        run: |
          git fetch origin main staging
          AHEAD=$(git rev-list origin/main..origin/staging --count)
          if [ "$AHEAD" = "0" ]; then
            echo "ahead=0" >> $GITHUB_OUTPUT
            echo "staging is already up to date with main — nothing to promote"
          else
            NON_SYNC=$(git log origin/main..origin/staging --format="%s" | grep -v "^chore: sync v" | wc -l | tr -d ' ')
            if [ "$NON_SYNC" = "0" ]; then
              echo "ahead=0" >> $GITHUB_OUTPUT
              echo "only version-sync commits ahead — skipping promotion to avoid release loop"
            else
              echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
              echo "staging is $AHEAD commits ahead of main"
            fi
          fi

      # `main` is protected with "Changes must be made through a pull request"
      # and enforce_admins on, so `git push origin main` is rejected for every
      # token — a PAT included. That GH006 rejection failed every weekly run
      # that actually had something to promote. Promotion goes through a PR now,
      # like any other change to main.
      #
      # The PR head is a throwaway branch rather than `staging` itself: this repo
      # has delete_branch_on_merge, and a merged PR whose head is `staging` asks
      # GitHub to delete the integration branch. Branch protection currently
      # refuses that deletion, but nothing should depend on it.
      - name: Open promotion PR
        id: pr
        if: steps.check.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          # Close any promotion PR left open by an earlier failed run so stale
          # ones don't pile up, then branch from the staging tip.
          for STALE in $(gh pr list --base main --state open --json number,headRefName \
              -q '.[] | select(.headRefName | startswith("ci/promote-staging-")) | .number'); do
            gh pr close "$STALE" --comment "Superseded by a newer promotion run." --delete-branch || true
          done

          BRANCH="ci/promote-staging-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -B "$BRANCH" origin/staging
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: weekly staging → main promotion ($(date -u +%Y-%m-%d))" \
            --body "Automated weekly promotion — ${{ steps.check.outputs.ahead }} commits from \`staging\`.")
          echo "url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Merge promotion PR
        id: merge
        if: steps.check.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          # main requires no approvals and has no required status checks, so this
          # merges immediately. --auto is the fallback if a future protection rule
          # makes the PR wait: the merge then happens once that rule is satisfied,
          # and this run reports the PR as still open.
          gh pr merge "$PR_URL" --merge --delete-branch \
            || gh pr merge "$PR_URL" --merge --auto --delete-branch
          STATE=$(gh pr view "$PR_URL" --json state -q .state)
          echo "state=$STATE" >> $GITHUB_OUTPUT
          if [ "$STATE" = "MERGED" ]; then
            echo "promoted staging → main via $PR_URL"
          else
            echo "::warning::$PR_URL is queued rather than merged (state: $STATE) — the release will start when it lands"
          fi

      - name: Check token availability
        id: token_check
        if: steps.merge.outputs.state == 'MERGED'
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "has_release_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_release_token=true" >> $GITHUB_OUTPUT
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # A merge performed with GITHUB_TOKEN does not raise a `push` event, so
      # release.yml would never see the promotion. Dispatch it by hand. With a
      # RELEASE_TOKEN the push event fires on its own and dispatching here would
      # run the release twice.
      - name: Dispatch release workflow
        if: steps.merge.outputs.state == 'MERGED' && steps.token_check.outputs.has_release_token == 'false'
        run: gh workflow run release.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
